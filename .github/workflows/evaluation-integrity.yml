name: Evaluation integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install lightweight test dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Compile public Python sources
        run: python -m compileall -q run_v2_experiments.py src validation

      - name: Run synthetic integrity and public-claim tests
        run: python -m unittest discover -s validation -p 'test_*.py' -v
